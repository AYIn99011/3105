name: Build Qingsao unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - adapt/worse-query
    paths:
      - 'standalone/**'
      - '.github/workflows/build-qingsao-ipa.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          ls /Applications | grep -i xcode || true
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=/Applications/Xcode.app; fi
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Generate project (XcodeGen)
        run: |
          which xcodegen || brew install xcodegen
          cd standalone
          xcodegen generate
          ls

      - name: Build (unsigned, iphoneos)
        run: |
          xcodebuild build \
            -project standalone/Qingsao.xcodeproj \
            -scheme Qingsao \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build"

      - name: Package IPA
        run: |
          APP_PATH=$(find build -name "*.app" -maxdepth 4 | head -1)
          echo "App: $APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload Qingsao-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Qingsao-unsigned.ipa Payload
          ls -lh Qingsao-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingsao-unsigned-ipa
          path: Qingsao-unsigned.ipa
          if-no-files-found: error
